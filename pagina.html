<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bola de Ouro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c0a08;--panel:#15110c;--line:#2e2616;--gold:#c9a24b;--champ:#efe3c2;--bronze:#8a6a24;--text:#e6dfcd;--mute:#a39a82;
--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--text);font:400 17px/1.7 var(--sans)}
a{color:var(--gold)}
a:focus-visible{outline:2px solid var(--champ);outline-offset:3px}
.wrap{max-width:820px;margin:0 auto;padding:0 22px}
nav{position:sticky;top:0;z-index:5;background:rgba(12,10,8,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{max-width:1040px;display:flex;gap:22px;align-items:center;height:54px;overflow-x:auto;white-space:nowrap}
nav b{font:700 21px var(--serif);margin-right:auto}
nav b a{color:var(--champ);text-decoration:none}
nav a{text-decoration:none;color:var(--mute);font-size:15px}
nav a:hover,nav a[aria-current]{color:var(--champ)}
article{padding:56px 0 40px;background:radial-gradient(60% 40% at 80% 0%,rgba(201,162,75,.16),transparent 70%)}
h1{font:700 clamp(36px,6vw,58px)/1.05 var(--serif);color:var(--champ);margin:0 0 22px}
h2{font:700 clamp(28px,4vw,38px)/1.15 var(--serif);color:var(--champ);margin:48px 0 12px;padding-top:6px;border-top:1px solid var(--line)}
h3{font:700 25px/1.2 var(--serif);color:var(--gold);margin:32px 0 8px}
p{margin:0 0 16px}
ul,ol{margin:0 0 18px;padding-left:24px}
li{margin:5px 0}
strong{color:var(--champ)}
em{color:var(--text)}
code{background:var(--panel);padding:1px 6px;border-radius:3px;font-size:.9em}
blockquote{margin:0 0 20px;padding:12px 18px;border-left:3px solid var(--gold);background:var(--panel);color:var(--mute)}
blockquote p{margin:0}
hr{border:0;border-top:1px solid var(--line);margin:40px 0 20px}
.tw{overflow-x:auto;margin:0 0 24px;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:top;line-height:1.5}
th{background:var(--panel);color:var(--mute);font-weight:600}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(201,162,75,.06)}
#erro{padding:16px;border:1px solid var(--bronze)}
</style>
</head>
<body>
<nav><div class="wrap">
<b><a href="index.html">Bola de Ouro</a></b>
<a href="index.html#vencedores">Vencedores</a>
<a href="indicados.html">Indicados</a>
<a href="pagina.html?p=ranking" data-p="ranking">Ranking</a>
<a href="pagina.html?p=perfis" data-p="perfis">Perfis</a>
<a href="pagina.html?p=historia" data-p="historia">História</a>
<a href="pagina.html?p=recordes-e-curiosidades" data-p="recordes-e-curiosidades">Recordes</a>
<a href="pagina.html?p=brasileiros" data-p="brasileiros">Brasileiros</a>
</div></nav>
<article><div class="wrap" id="conteudo"><p>Carregando.</p></div></article>

<script>
const REPO="https://github.com/nextocode/bola-de-ouro-wiki/tree/main/";
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const slug=t=>t.toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu,"").trim().replace(/\s+/g,"-");

function rota(u){
  if(/^https?:/.test(u))return `href="${u}" target="_blank" rel="noopener"`;
  u=u.replace(/^(\.\.\/|\.\/)+/,"");
  if(/^README\.md/.test(u))return 'href="index.html"';
  if(/^(vencedores-masculino|vencedoras-feminino)\.md/.test(u))return 'href="index.html#vencedores"';
  const m=u.match(/^([a-z-]+)\.md(#.*)?$/);
  if(m)return `href="pagina.html?p=${m[1]}${m[2]||""}"`;
  if(/^data/.test(u))return `href="${REPO}data" target="_blank" rel="noopener"`;
  return `href="${REPO}${u}" target="_blank" rel="noopener"`;
}
function inline(t){
  t=esc(t).replace(/\\\*/g,"&#42;");
  t=t.replace(/`([^`]+)`/g,"<code>$1</code>");
  t=t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,x,u)=>`<a ${rota(u)}>${x}</a>`);
  t=t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  t=t.replace(/(^|[^\w])_([^_]+)_(?=[^\w]|$)/g,"$1<em>$2</em>");
  return t;
}
function md(src){
  const L=src.replace(/<!--[\s\S]*?-->/g,"").replace(/\r/g,"").split("\n");
  let h="",i=0;
  const cells=l=>l.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
  while(i<L.length){
    const l=L[i];
    if(!l.trim()){i++;continue}
    let m;
    if(m=l.match(/^(#{1,3})\s+(.*)$/)){const n=m[1].length;h+=`<h${n} id="${slug(m[2])}">${inline(m[2])}</h${n}>`;i++;continue}
    if(/^---+$/.test(l.trim())){h+="<hr>";i++;continue}
    if(l.startsWith("|")){
      const cab=cells(l);i+=2;let t="<div class='tw'><table><thead><tr>"+cab.map(c=>`<th>${inline(c)}</th>`).join("")+"</tr></thead><tbody>";
      while(i<L.length&&L[i].startsWith("|")){t+="<tr>"+cells(L[i]).map(c=>`<td>${inline(c)}</td>`).join("")+"</tr>";i++}
      h+=t+"</tbody></table></div>";continue}
    if(l.startsWith(">")){let b=[];while(i<L.length&&L[i].startsWith(">")){b.push(L[i].replace(/^>\s?/,""));i++}h+=`<blockquote><p>${inline(b.join(" "))}</p></blockquote>`;continue}
    if(/^(-|\d+\.)\s/.test(l)){const o=/^\d/.test(l),tag=o?"ol":"ul";let li="";
      while(i<L.length&&/^(-|\d+\.)\s/.test(L[i])){li+=`<li>${inline(L[i].replace(/^(-|\d+\.)\s+/,""))}</li>`;i++}
      h+=`<${tag}>${li}</${tag}>`;continue}
    let p=[];while(i<L.length&&L[i].trim()&&!/^(#|\||>|---|-\s|\d+\.\s)/.test(L[i])){p.push(L[i]);i++}
    h+=`<p>${inline(p.join(" "))}</p>`;
  }
  return h;
}

const p=(new URLSearchParams(location.search).get("p")||"").toLowerCase();
const ok=["perfis","ranking","historia","recordes-e-curiosidades","brasileiros"];
const box=document.getElementById("conteudo");
document.querySelectorAll("nav [data-p]").forEach(a=>{if(a.dataset.p===p)a.setAttribute("aria-current","page")});
if(!ok.includes(p)){box.innerHTML='<h1>Página não encontrada</h1><p>Volte ao <a href="index.html">início</a> e escolha uma das páginas do menu.</p>'}
else fetch("docs/"+p+".md").then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{
  box.innerHTML=md(t);
  const h1=box.querySelector("h1");if(h1)document.title=h1.textContent+" | Bola de Ouro";
  if(location.hash){const e=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(e)e.scrollIntoView()}
}).catch(()=>{box.innerHTML='<div id="erro">Não consegui carregar esta página. Abra o site pelo endereço do GitHub Pages e confira se a pasta docs está no repositório.</div>'});
</script>
</body>
</html>
